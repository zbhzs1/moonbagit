name: Check build test and interoperability
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install MoonBit on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-RestMethod https://cli.moonbitlang.com/install/powershell.ps1 | Invoke-Expression
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: moon version --all
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: moon fmt --check
      - run: moon check --target js --deny-warn
      - run: moon test --target js
      - run: moon test --target wasm-gc
      - run: moon build --target js
      - run: moon run examples/core --target wasm-gc
      - run: moon run examples/core --target js
      - run: python -m pip install bagit==1.9.0
      - run: python scripts/interop.py
      - name: Record released bagit-python bidirectional evidence
        run: python scripts/interop_report.py --source-id PyPI:bagit==1.9.0 --output interop-evidence/released
      - name: Fetch pinned native BagIt 1.0 producer
        uses: actions/checkout@v4
        with:
          repository: LibraryOfCongress/bagit-python
          ref: 4bd2713cedbe1f8e634567c20ef0dded9622011d
          path: .interop/bagit-python
          persist-credentials: false
      - name: Install isolated pinned producer
        run: python -m pip install --no-deps --target .interop/upstream ./.interop/bagit-python
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: 0.0.0
      - name: Record native 1.0 bidirectional evidence without declaration rewriting
        run: python scripts/interop_report.py --bagit-path .interop/upstream --source-id LibraryOfCongress/bagit-python@4bd2713cedbe1f8e634567c20ef0dded9622011d --require-native-1 --output interop-evidence/native-1.0
      - name: BagIt required behavior and authorized end-to-end receipt
        run: python scripts/rfc8493.py --bagit-path .interop/upstream
      - name: Preservation snapshots policies and handoff regressions
        run: python scripts/preservation.py
      - name: Upload reports and actual generated bags for independent review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bagit-bidirectional-${{ matrix.os }}
          path: interop-evidence/
          if-no-files-found: error
          retention-days: 30
      - name: Fetch pinned independent conformance fixtures
        run: git -c core.autocrlf=false clone https://github.com/LibraryOfCongress/bagit-conformance-suite.git ../bagit-conformance-suite
      - name: Pin fixture revision
        run: git -C ../bagit-conformance-suite checkout 9ab48705c06664f9f419ca740c728c9f89a61e7c
      - run: python scripts/conformance.py ../bagit-conformance-suite
      - run: python scripts/benchmark.py --files 1000 --bytes 1024
      - run: python scripts/consumer.py
